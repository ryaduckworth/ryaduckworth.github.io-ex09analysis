# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Rya Duckworth & Camrie Sifford EX09 Analysis
email: ryamduck@unc.edu
description: >- # this means to ignore newlines until "baseurl:"
  An analysis of the data from the Comp 110 survey conducted in Spring 2026.
  This analysis takes the count of students who rated the class difficult, and compares it to the majors 
  and interest in the class of the survey participants. This was then used to support the implementation 
  of detailed video explanations.
baseurl: "-ex09analysis" # the subpath of your site, e.g. /blog
url: "ryaduckworth.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: jekyllrb
github_username:  jekyll

# Build settings
# Build settings
remote_theme: "jekyll/minima@1e8a445"

plugins:
  - jekyll-remote-theme
